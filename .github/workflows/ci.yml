name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch client submodule
        run: |
          git -c "url.https://github.com/.insteadOf=git@personal:" submodule update --init client
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: client
      - run: bun run biome lint .
        working-directory: client
      - run: bun run tsc
        working-directory: client
      - run: bun run vitest run
        working-directory: client

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch server submodule
        run: |
          git -c "url.https://github.com/.insteadOf=git@personal:" submodule update --init server
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
        working-directory: server
      - run: go test ./...
        working-directory: server
