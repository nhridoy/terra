name: Client CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch private client submodule
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_READ_TOKEN}@github.com/.insteadOf=git@personal:" submodule update --init client
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: client
        run: bun install --frozen-lockfile
      - name: Run Biome
        working-directory: client
        run: bun run biome lint .
      - name: Type check
        working-directory: client
        run: bun run tsc

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch private client submodule
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_READ_TOKEN}@github.com/.insteadOf=git@personal:" submodule update --init client
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: client
        run: bun install --frozen-lockfile
      - name: Run tests
        working-directory: client
        run: bun run vitest run

  build:
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Fetch private client submodule
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_READ_TOKEN}@github.com/.insteadOf=git@personal:" submodule update --init client
      - uses: oven-sh/setup-bun@v2
      - name: Check build API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: test -n "$VITE_API_URL" || { echo 'Repository variable VITE_API_URL is required'; exit 1; }
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 libssl-dev
      - name: Install frontend dependencies
        working-directory: client
        run: bun install --frozen-lockfile
      - name: Build Tauri app
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun tauri build --target ${{ matrix.target }} --ci
      - uses: actions/upload-artifact@v4
        with:
          name: terra-${{ matrix.os }}
          path: client/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
