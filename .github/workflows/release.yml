name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release credentials
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$SUBMODULE_READ_TOKEN" || { echo 'SUBMODULE_READ_TOKEN is required'; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is required'; exit 1; }
      - name: Fetch exact client submodule revision
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_READ_TOKEN}@github.com/.insteadOf=git@personal:" submodule update --init client
      - name: Check tag and app version
        run: |
          VERSION="$(node -p "require('./client/src-tauri/tauri.conf.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || { echo 'Tag and Tauri version differ'; exit 1; }

  server:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact server submodule revision
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_READ_TOKEN}@github.com/.insteadOf=git@personal:" submodule update --init server
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Build server
        working-directory: server
        run: |
          go build -o termvault-server ./cmd/termvault-server
          tar -czf termvault-server-linux-amd64.tar.gz termvault-server
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: server/termvault-server-linux-amd64.tar.gz
          if-no-files-found: error

  desktop:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: darwin-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: darwin-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact client submodule revision
        shell: bash
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_READ_TOKEN}@github.com/.insteadOf=git@personal:" submodule update --init client
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 libssl-dev
      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Build signed desktop bundles
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: client/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error

  publish:
    needs: [server, desktop, docker]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact client submodule revision
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_READ_TOKEN}@github.com/.insteadOf=git@personal:" submodule update --init client
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-*'
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: server
          path: server-assets
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f "tag_name=${GITHUB_REF_NAME}" --jq '.body' > release-notes.md
      - name: Test and build update manifest
        run: |
          node scripts/build-update-manifest.test.mjs
          node scripts/build-update-manifest.mjs --version "${GITHUB_REF_NAME#v}" --tag "$GITHUB_REF_NAME" --assets release-assets --output publish-assets --notes-file release-notes.md --pubkey-config client/src-tauri/tauri.conf.json
          cp server-assets/termvault-server-linux-amd64.tar.gz publish-assets/
      - name: Create draft release with validated artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: publish-assets/*
          fail_on_unmatched_files: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  docker:
    needs: preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact server submodule revision
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_READ_TOKEN}@github.com/.insteadOf=git@personal:" submodule update --init server
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/termvault-server:latest
            ghcr.io/${{ github.repository_owner }}/termvault-server:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
