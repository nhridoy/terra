version: '3.8'

services:
  termvault:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: termvault
    ports:
      - "${TERMVAULT_PORT:-8080}:8080"
    environment:
      - TERMVAULT_PORT=8080
      - TERMVAULT_HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/termvault.db}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_GITLAB_CLIENT_ID=${OAUTH_GITLAB_CLIENT_ID:-}
      - OAUTH_GITLAB_CLIENT_SECRET=${OAUTH_GITLAB_CLIENT_SECRET:-}
      - OAUTH_MICROSOFT_CLIENT_ID=${OAUTH_MICROSOFT_CLIENT_ID:-}
      - OAUTH_MICROSOFT_CLIENT_SECRET=${OAUTH_MICROSOFT_CLIENT_SECRET:-}
    volumes:
      - termvault-data:/data
      - termvault-logs:/var/log/termvault
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: PostgreSQL for production
  postgres:
    image: postgres:15-alpine
    container_name: termvault-postgres
    environment:
      - POSTGRES_DB=termvault
      - POSTGRES_USER=${POSTGRES_USER:-termvault}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-termvault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: termvault-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Release server for auto-updates
  release-server:
    build:
      context: ./release-server
      dockerfile: Dockerfile
    container_name: termvault-releases
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RELEASE_DIR=/data/releases
      - BASE_URL=${RELEASE_BASE_URL:-https://releases.termvault.app}
      - CURRENT_VERSION=${CURRENT_VERSION:-1.0.0}
      - UPDATE_PUBLIC_KEY=${UPDATE_PUBLIC_KEY:-}
    volumes:
      - release-data:/data/releases
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  termvault-data:
    driver: local
  termvault-logs:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
