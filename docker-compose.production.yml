version: '3.8'

# Production configuration
# Usage: docker-compose -f docker-compose.production.yml up -d

services:
  termvault:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: termvault
    ports:
      - "${TERMVAULT_PORT:-8080}:8080"
    environment:
      - TERMVAULT_PORT=8080
      - TERMVAULT_HOST=0.0.0.0
      - DATABASE_URL=postgres://termvault:${POSTGRES_PASSWORD}@postgres:5432/termvault
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - BASE_URL=${BASE_URL:-https://your-domain.com}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
    volumes:
      - termvault-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:15-alpine
    container_name: termvault-postgres
    environment:
      - POSTGRES_DB=termvault
      - POSTGRES_USER=termvault
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termvault"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: termvault-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # Release server for auto-updates
  release-server:
    build:
      context: ./release-server
      dockerfile: Dockerfile
    container_name: termvault-releases
    environment:
      - PORT=3000
      - RELEASE_DIR=/data/releases
      - BASE_URL=${RELEASE_BASE_URL:-https://releases.termvault.app}
      - CURRENT_VERSION=${CURRENT_VERSION:-1.0.0}
      - UPDATE_PUBLIC_KEY=${UPDATE_PUBLIC_KEY}
    volumes:
      - release-data:/data/releases
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: termvault-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - termvault
      - release-server
    restart: always

volumes:
  termvault-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  release-data:
    driver: local
